<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <script>
    if (!localStorage.getItem("adminToken")) {
      window.location.href = "admin-login.html";
    }
  </script>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    body { font-family: 'Arial', sans-serif; background-color: #f4f6f9; }
    .sidebar { height: 100vh; width: 220px; position: fixed; top: 0; left: 0; background-color: #343a40; padding-top: 20px; color: #fff; }
    .sidebar a { color: #c2c7d0; display: block; padding: 15px; text-decoration: none; }
    .sidebar a:hover { background-color: #495057; color: #fff; }
    .sidebar h2 { color: #fff; text-align: center; margin-bottom: 30px; }
    .main-content { margin-left: 220px; padding: 20px; }
    .card-stats { margin-bottom: 20px; }
    .table-container { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
    .logout-btn { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 80%; }
    .error-msg { color: red; margin-top: 10px; }
    .stat-icon { font-size: 2rem; opacity: 0.3; position: absolute; right: 20px; top: 15px; }
    .chart-card { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-bottom: 20px; }
    .chart-card h5 { font-size: 0.95rem; font-weight: 600; color: #495057; margin-bottom: 15px; }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <h2>Admin Panel</h2>
    <a href="#" id="dashboard-link"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
    <a href="#" id="enquiries-link"><i class="fas fa-envelope"></i> Enquiries</a>
    <button class="btn btn-danger logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div id="dashboard-section">
      <h3>Dashboard</h3>
      
      <!-- Stat Cards Row -->
      <div class="row">
        <div class="col-md-3">
          <div class="card card-stats text-white" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); position: relative; overflow: hidden;">
            <div class="card-body">
              <h6 style="opacity: 0.8; margin-bottom: 5px;">Total Enquiries</h6>
              <h2 id="total-enquiries" style="font-weight: 700;">0</h2>
              <i class="fas fa-envelope stat-icon"></i>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card card-stats text-white" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); position: relative; overflow: hidden;">
            <div class="card-body">
              <h6 style="opacity: 0.8; margin-bottom: 5px;">Pending</h6>
              <h2 id="stat-pending" style="font-weight: 700;">0</h2>
              <i class="fas fa-clock stat-icon"></i>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card card-stats text-white" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); position: relative; overflow: hidden;">
            <div class="card-body">
              <h6 style="opacity: 0.8; margin-bottom: 5px;">In Progress</h6>
              <h2 id="stat-in-progress" style="font-weight: 700;">0</h2>
              <i class="fas fa-spinner stat-icon"></i>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card card-stats text-white" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); position: relative; overflow: hidden;">
            <div class="card-body">
              <h6 style="opacity: 0.8; margin-bottom: 5px;">Resolved</h6>
              <h2 id="stat-resolved" style="font-weight: 700;">0</h2>
              <i class="fas fa-check-circle stat-icon"></i>
            </div>
          </div>
        </div>
      </div>

      <!-- Charts Row -->
      <div class="row mt-4">
        <div class="col-md-8">
          <div class="chart-card">
            <h5><i class="fas fa-chart-bar mr-2" style="color: #667eea;"></i>Enquiry Trends (Last 7 Days)</h5>
            <canvas id="trendChart" height="120"></canvas>
          </div>
        </div>
        <div class="col-md-4">
          <div class="chart-card">
            <h5><i class="fas fa-chart-pie mr-2" style="color: #f5576c;"></i>Status Distribution</h5>
            <canvas id="statusChart" height="180"></canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- Enquiries Section -->
    <div id="enquiries-section" style="display:none;">
      <h3>Customer Enquiries</h3>
      <div class="table-container mt-3">
        <table class="table table-striped" id="enquiries-table">
          <thead class="thead-dark">
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Message</th>
              <th>Date</th>
              <th>Status</th>
              <th>Response / Reply</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <p id="fetch-error" class="error-msg" style="display:none;"></p>
      </div>
    </div>
  </div>

  <script>
    const dashboardLink = document.getElementById('dashboard-link');
    const enquiriesLink = document.getElementById('enquiries-link');
    const dashboardSection = document.getElementById('dashboard-section');
    const enquiriesSection = document.getElementById('enquiries-section');

    // Toggle sections
    dashboardLink.addEventListener('click', (e) => {
      e.preventDefault();
      dashboardSection.style.display = 'block';
      enquiriesSection.style.display = 'none';
    });
    enquiriesLink.addEventListener('click', (e) => {
      e.preventDefault();
      dashboardSection.style.display = 'none';
      enquiriesSection.style.display = 'block';
      fetchEnquiries();
    });

    async function fetchEnquiries() {
      const token = localStorage.getItem("adminToken");
      if (!token) return window.location.href = "admin-login.html";

      const errorEl = document.getElementById("fetch-error");
      errorEl.style.display = "none";

      try {
        const res = await fetch("http://localhost:5000/api/admin/enquiries", {
          headers: { "Authorization": "Bearer " + token }  // Space after Bearer
        });

        if (!res.ok) {
          throw new Error(`HTTP ${res.status}: ${res.statusText}`);
        }

        const data = await res.json();

        if (!data.success) {
          throw new Error(data.error || "Unknown error");
        }

        // Update total enquiries in dashboard
        document.getElementById("total-enquiries").innerText = data.enquiries.length;

        // Update stat cards
        const statusCounts = { pending: 0, under_review: 0, in_progress: 0, resolved: 0 };
        data.enquiries.forEach(eq => {
          const s = eq.status || (eq.response ? 'resolved' : 'pending');
          if (statusCounts[s] !== undefined) statusCounts[s]++;
        });
        document.getElementById("stat-pending").innerText = statusCounts.pending + statusCounts.under_review;
        document.getElementById("stat-in-progress").innerText = statusCounts.in_progress;
        document.getElementById("stat-resolved").innerText = statusCounts.resolved;

        // Render charts
        renderAnalyticsCharts(data.enquiries, statusCounts);

        // Populate table
        const tbody = document.querySelector("#enquiries-table tbody");
        tbody.innerHTML = "";
        if (data.enquiries.length === 0) {
          tbody.innerHTML = '<tr><td colspan="8" class="text-center">No enquiries yet.</td></tr>';
        } else {
          data.enquiries.forEach(e => {
            const escapedResponse = e.response ? e.response.replace(/"/g, '&quot;').replace(/'/g, '&#39;') : '';
            
            // Status dropdown options HTML
            const statusOptions = ['pending', 'under_review', 'in_progress', 'resolved'];
            const statusLabels = {
              'pending': 'Pending',
              'under_review': 'Under Review',
              'in_progress': 'In Progress',
              'resolved': 'Resolved'
            };
            const currentStatus = e.status || (e.response ? 'resolved' : 'pending');
            
            let statusSelectHTML = `<select class="form-control form-control-sm" onchange="updateStatus('${e._id}', this.value)" style="width:130px;">`;
            statusOptions.forEach(opt => {
              const selected = opt === currentStatus ? 'selected' : '';
              statusSelectHTML += `<option value="${opt}" ${selected}>${statusLabels[opt]}</option>`;
            });
            statusSelectHTML += `</select>`;

            // Action / Response HTML
            let actionHTML = '';
            if (e.response) {
              actionHTML = `
                <div id="display-container-${e._id}" class="d-flex align-items-center justify-content-between">
                  <span class="text-success">${e.response}</span>
                  <button class="btn btn-sm btn-outline-primary ml-2" data-resp="${escapedResponse}" onclick="startInlineEdit('${e._id}', this.getAttribute('data-resp'))">
                    <i class="fas fa-edit"></i> Edit
                  </button>
                </div>
                <div id="edit-container-${e._id}" class="input-group" style="display: none;">
                  <input type="text" id="resp-${e._id}" class="form-control form-control-sm" placeholder="Type reply...">
                  <div class="input-group-append">
                    <button class="btn btn-sm btn-outline-info" onclick="generateAISuggestion('${e._id}', this)" title="Generate AI Suggestion">✨ AI</button>
                    <button class="btn btn-sm btn-primary" onclick="submitResponse('${e._id}')">Save</button>
                    <button class="btn btn-sm btn-outline-secondary" onclick="cancelInlineEdit('${e._id}')">Cancel</button>
                  </div>
                </div>
              `;
            } else {
              actionHTML = `
                <div id="edit-container-${e._id}" class="input-group">
                  <input type="text" id="resp-${e._id}" class="form-control form-control-sm" placeholder="Type reply...">
                  <div class="input-group-append">
                    <button class="btn btn-sm btn-outline-info" onclick="generateAISuggestion('${e._id}', this)" title="Generate AI Suggestion">✨ AI</button>
                    <button class="btn btn-sm btn-primary" onclick="submitResponse('${e._id}')">Save</button>
                  </div>
                </div>
              `;
            }
            
            tbody.innerHTML += `<tr>
              <td>${e.name || 'N/A'}</td>
              <td>${e.email || 'N/A'}</td>
              <td>${e.phone || 'N/A'}</td>
              <td>${e.message || 'N/A'}</td>
              <td>${new Date(e.createdAt).toLocaleString()}</td>
              <td>${statusSelectHTML}</td>
              <td>${actionHTML}</td>
              <td>
                <button class="btn btn-sm btn-danger" onclick="deleteEnquiry('${e._id}')">
                  <i class="fas fa-trash-alt"></i> Delete
                </button>
              </td>
            </tr>`;
          });
        }
      } catch (err) {
        console.error("Error fetching enquiries:", err);
        errorEl.textContent = `Error: ${err.message}`;
        errorEl.style.display = "block";
      }
    }

    window.submitResponse = async function(id) {
      const el = document.getElementById('resp-' + id);
      const responseText = el ? el.value : "";
      if (!responseText.trim()) return alert("Please type a response");
      
      const token = localStorage.getItem("adminToken");
      try {
        const res = await fetch(`http://localhost:5000/api/admin/enquiries/${id}/respond`, {
          method: 'PUT',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token 
          },
          body: JSON.stringify({ response: responseText })
        });
        const data = await res.json();
        if (data.success) {
          fetchEnquiries(); // Refresh the table automatically
        } else {
          alert("Error saving response: " + data.error);
        }
      } catch(err) {
        console.error(err);
        alert("Failed to save response");
      }
    };

    window.generateAISuggestion = async function(id, btn) {
      const originalText = btn ? btn.innerHTML : "✨ AI";
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i>`;
      }
      
      const token = localStorage.getItem("adminToken");
      try {
        const res = await fetch(`http://localhost:5000/api/admin/enquiries/${id}/suggest-reply`, {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + token
          }
        });
        
        const data = await res.json();
        if (data.success) {
          const input = document.getElementById('resp-' + id);
          if (input) {
            input.value = data.suggestion;
          }
        } else {
          alert("AI Error: " + (data.error || "Failed to generate reply"));
        }
      } catch(err) {
        console.error(err);
        alert("Failed to connect to AI server");
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = originalText;
        }
      }
    };

    window.updateStatus = async function(id, newStatus) {
      const token = localStorage.getItem("adminToken");
      try {
        const res = await fetch(`http://localhost:5000/api/admin/enquiries/${id}/respond`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ status: newStatus })
        });
        const data = await res.json();
        if (data.success) {
          fetchEnquiries(); // Refresh the table
        } else {
          alert("Error updating status: " + data.error);
        }
      } catch(err) {
        console.error(err);
        alert("Failed to update status");
      }
    };

    window.deleteEnquiry = async function(id) {
      if (!confirm("Are you sure you want to delete this enquiry?")) return;
      const token = localStorage.getItem("adminToken");
      try {
        const res = await fetch(`http://localhost:5000/api/admin/enquiries/${id}`, {
          method: 'DELETE',
          headers: {
            'Authorization': 'Bearer ' + token
          }
        });
        const data = await res.json();
        if (data.success) {
          fetchEnquiries();
        } else {
          alert("Error deleting enquiry: " + data.error);
        }
      } catch(err) {
        console.error(err);
        alert("Failed to delete enquiry");
      }
    };

    window.startInlineEdit = function(id, currentResp) {
      document.getElementById(`display-container-${id}`).style.display = 'none';
      document.getElementById(`edit-container-${id}`).style.display = 'flex';
      const input = document.getElementById(`resp-${id}`);
      if (input) {
        input.value = currentResp;
        input.focus();
      }
    };

    window.cancelInlineEdit = function(id) {
      document.getElementById(`display-container-${id}`).style.display = 'flex';
      document.getElementById(`edit-container-${id}`).style.display = 'none';
    };

    function logout() {
      localStorage.removeItem("adminToken");
      window.location.href = "login.html";
    }

    // ===== ANALYTICS CHARTS =====
    let trendChartInstance = null;
    let statusChartInstance = null;

    function renderAnalyticsCharts(enquiries, statusCounts) {
      // --- 7-Day Trend Bar Chart ---
      const today = new Date();
      const labels = [];
      const dailyCounts = [];

      for (let i = 6; i >= 0; i--) {
        const d = new Date(today);
        d.setDate(d.getDate() - i);
        const dateStr = d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' });
        labels.push(dateStr);

        const dayStart = new Date(d.getFullYear(), d.getMonth(), d.getDate());
        const dayEnd = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);

        const count = enquiries.filter(e => {
          const created = new Date(e.createdAt);
          return created >= dayStart && created < dayEnd;
        }).length;

        dailyCounts.push(count);
      }

      const trendCtx = document.getElementById('trendChart');
      if (trendCtx) {
        if (trendChartInstance) trendChartInstance.destroy();
        trendChartInstance = new Chart(trendCtx.getContext('2d'), {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [{
              label: 'Enquiries',
              data: dailyCounts,
              backgroundColor: 'rgba(102, 126, 234, 0.7)',
              borderColor: '#667eea',
              borderWidth: 2,
              borderRadius: 6,
              borderSkipped: false,
            }]
          },
          options: {
            responsive: true,
            plugins: {
              legend: { display: false },
            },
            scales: {
              y: {
                beginAtZero: true,
                ticks: { stepSize: 1, font: { size: 12 } },
                grid: { color: 'rgba(0,0,0,0.05)' }
              },
              x: {
                ticks: { font: { size: 11 } },
                grid: { display: false }
              }
            }
          }
        });
      }

      // --- Status Doughnut Chart ---
      const statusCtx = document.getElementById('statusChart');
      if (statusCtx) {
        if (statusChartInstance) statusChartInstance.destroy();
        statusChartInstance = new Chart(statusCtx.getContext('2d'), {
          type: 'doughnut',
          data: {
            labels: ['Pending', 'Under Review', 'In Progress', 'Resolved'],
            datasets: [{
              data: [
                statusCounts.pending,
                statusCounts.under_review,
                statusCounts.in_progress,
                statusCounts.resolved
              ],
              backgroundColor: [
                '#f5576c',
                '#4facfe',
                '#667eea',
                '#43e97b'
              ],
              borderWidth: 2,
              borderColor: '#fff',
              hoverOffset: 8,
            }]
          },
          options: {
            responsive: true,
            cutout: '60%',
            plugins: {
              legend: {
                position: 'bottom',
                labels: { padding: 15, usePointStyle: true, pointStyleWidth: 10, font: { size: 12 } }
              }
            }
          }
        });
      }
    }

    // Load on page load
    window.addEventListener('load', fetchEnquiries);
  </script>
</body>
</html>
