<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Enquiries - Gigahub</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
</head>
<body style="background-color:#f8f9fa; padding:20px;">
  <div class="container">
    <h2 class="mb-4">📋 My Enquiries</h2>
    <div id="enquiriesList" class="list-group"></div>
  </div>

  <script>
    const enquiriesList = document.getElementById("enquiriesList");
    const token = localStorage.getItem("accessToken");

    if (!token) {
      alert("Please log in first.");
      window.location.href = "login.html";
    } else {
      fetch("http://localhost:5000/api/enquiries/user", {
        headers: { "Authorization": "Bearer " + token }
      })
      .then(res => res.json())
      .then(data => {
        if (!Array.isArray(data) || data.length === 0) {
          enquiriesList.innerHTML = "<p>No enquiries yet.</p>";
          return;
        }

        data.forEach(e => {
          const item = document.createElement("div");
          item.className = "list-group-item";
          item.innerHTML = `
            <h5>${e.subject || "Enquiry"}</h5>
            <p><strong>Your Message:</strong> ${e.message}</p>
            <p><strong>Admin Response:</strong> ${
              e.response ? e.response : "<span class='text-muted'>No response yet</span>"
            }</p>
            <small class="text-secondary">
              Submitted on: ${new Date(e.createdAt).toLocaleString()}
            </small>
          `;
          enquiriesList.appendChild(item);
        });
      })
      .catch(err => {
        console.error("Error fetching enquiries:", err);
        enquiriesList.innerHTML = "<p>Error loading enquiries.</p>";
      });
    }
  </script>
</body>
</html>
