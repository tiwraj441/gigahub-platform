<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - Gigahub</title>
<style>
body { font-family: Arial; display:flex; justify-content:center; align-items:center; height:100vh; background:#f0f4f8; }
.container { background:#fff; padding:2rem; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,0.1); width:350px; text-align:center; }
input, button { width:100%; padding:0.8rem; margin:0.5rem 0; border-radius:8px; border:1px solid #ccc; font-size:1rem; }
button { background:#007BFF; color:white; border:none; cursor:pointer; }
button:hover { background:#0056b3; }
#status { margin-top:1rem; font-weight:bold; }
</style>
</head>
<body>

<div class="container">
<h2>Reset Your Password</h2>
<input type="password" id="newPassword" placeholder="New Password" minlength="6" required>
<button id="resetBtn">Reset Password</button>
<div id="status"></div>
</div>

<script>
const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? 'http://localhost:5000' : '';
// Get token from URL
const urlParams = new URLSearchParams(window.location.search);
const token = urlParams.get('token');
const status = document.getElementById('status');

document.getElementById('resetBtn').addEventListener('click', async () => {
    const newPassword = document.getElementById('newPassword').value.trim();
    if (!newPassword) { status.textContent="❌ Enter a new password"; status.style.color="red"; return; }
    
    status.textContent="⏳ Resetting password..."; status.style.color="#1976d2";

    try {
        const res = await fetch(`${API_BASE}/api/auth/reset-password`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, newPassword })
        });
        const data = await res.json();
        if(res.ok && data.success){ 
            status.textContent="✅ Password updated successfully! Redirecting to login...";
            status.style.color="green";
            setTimeout(()=>{ window.location.href="login.html"; },2000);
        } else { 
            status.textContent=`❌ ${data.error || "Failed to reset password"}`; 
            status.style.color="red";
        }
    } catch(err){
        console.error(err);
        status.textContent="❌ Network error"; status.style.color="red";
    }
});
</script>

</body>
</html>
