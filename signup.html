<DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup - Gigahub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { height: 100vh; display: flex; justify-content: center; align-items: center; background: #f0f4f8; }
    .form-container { background: #fff; padding: 2rem 3rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 400px; text-align: center; }
    h1 { margin-bottom: 1.5rem; color: #007BFF; }
    input, select { width: 100%; padding: 0.8rem 1rem; margin: 0.5rem 0; border-radius: 8px; border: 1px solid #ccc; font-size: 1rem; }
    button { width: 100%; padding: 0.8rem 1rem; margin-top: 1rem; border: none; border-radius: 8px; background: #007BFF; color: #fff; font-size: 1rem; cursor: pointer; transition: background 0.3s; }
    button:hover { background: #0056b3; }
    p { margin-top: 1rem; font-size: 0.9rem; }
    a { color: #007BFF; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .back-home { display: block; margin-top: 0.5rem; font-size: 0.9rem; color: #007BFF; }
    .back-home:hover { color: #0056b3; }
    #statusMessage { margin-top: 1rem; font-weight: bold; min-height: 1.2em; }
  </style>
</head>
<body>

  <div class="form-container">
    <h1>Signup</h1>
    <form id="signupForm">
      <select name="role" id="role" required>
        <option value="" disabled selected>Signup as...</option>
        <option value="client">Client</option>
        <option value="customer">Customer</option>
        <option value="admin">Admin</option>
      </select>
      <input type="text" name="name" placeholder="Full Name" required>
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Signup</button>
    </form>
    <p id="statusMessage"></p>
    <p>Already have an account? <a href="login.html">Login</a></p>
    <a href="index.html" class="back-home">Back to Home</a>
  </div>

  <script>
    const form = document.getElementById("signupForm");
    const statusMessage = document.getElementById("statusMessage");

    form.addEventListener("submit", async (e) => {
      e.preventDefault(); // prevent page reload

      statusMessage.textContent = "⏳ Signing up...";
      statusMessage.style.color = "blue";

      const role = form.role.value;

      // Build JSON payload
      const formData = {
        name: form.name.value.trim(),
        email: form.email.value.trim(),
        password: form.password.value,
        role: role
      };

      try {
        let url = "http://localhost:5000/api/auth/register";
        if (role === "admin") {
          url = "http://localhost:5000/api/admin/register";
        }

        // Send proper JSON to backend
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include", // important if backend sets cookies
          body: JSON.stringify(formData)
        });

        // Parse backend response
        const data = await response.json();

        if (data.success) {
          statusMessage.textContent = "✅ Signup successful!";
          statusMessage.style.color = "green";

          // Save token if needed
          localStorage.setItem("accessToken", data.accessToken);

          form.reset(); // clear form

          // Optionally redirect after 2 seconds
          setTimeout(() => window.location.href = "login.html", 2000);
        } else {
          statusMessage.textContent = "❌ " + (data.error || "Signup failed");
          statusMessage.style.color = "red";
        }

      } catch (err) {
        console.error(err);
        statusMessage.textContent = "❌ Server error. Please try again later.";
        statusMessage.style.color = "red";
      }
    });
  </script>

</body>
</html>
