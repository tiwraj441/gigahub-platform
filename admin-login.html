<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - Gigahub</title>

<!-- Bootstrap CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.5.3/css/bootstrap.min.css">
<!-- Font Awesome for icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
<!-- Your custom CSS -->
<link rel="stylesheet" href="./css/style.css">

<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #f2f2f2;
  }
  .login-card {
    padding: 40px;
    border-radius: 10px;
    background: #fff;
    box-shadow: 0px 0px 20px rgba(0,0,0,0.1);
    width: 400px;
    max-width: 90%;
  }
  .login-card h3 {
    text-align: center;
    margin-bottom: 30px;
    color: #007bff;
  }
  .btn-primary {
    background-color: #007bff;
    border: none;
  }
  .btn-primary:hover {
    background-color: #0056b3;
  }
  .register-link {
    display: block;
    text-align: center;
    margin-top: 15px;
  }
</style>
</head>
<body>

<div class="login-card">
  <h3><i class="fas fa-user-shield"></i> Admin Login</h3>
  <form id="adminLoginForm">
    <div class="form-group">
      <input type="email" class="form-control" id="email" placeholder="Admin Email" required>
    </div>
    <div class="form-group">
      <input type="password" class="form-control" id="password" placeholder="Password" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Login</button>
  </form>

  <!-- Optional: Register button for admin (if you want) -->
  <a href="admin-register.html" class="btn btn-outline-primary btn-block register-link">
    Register as Admin
  </a>
</div>

<!-- Bootstrap JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
        const res = await fetch('http://localhost:5000/api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if(data.token){
            localStorage.setItem('adminToken', data.token);
            window.location.href = 'admin.html'; // your admin panel page
        } else {
            alert(data.message || 'Invalid credentials');
        }
    } catch(err){
        console.error(err);
        alert('Server error');
    }
});
</script>
</body>
</html>
