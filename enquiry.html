<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Send Enquiry - Gigahub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f0f4f8;
    }

    .form-container {
      background: #fff;
      padding: 2rem 3rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 400px;
      text-align: center;
    }

    h1 {
      margin-bottom: 1.5rem;
      color: #007BFF;
    }

    input, textarea {
      width: 100%;
      padding: 0.8rem 1rem;
      margin: 0.5rem 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    button {
      width: 100%;
      padding: 0.8rem 1rem;
      margin-top: 1rem;
      border: none;
      border-radius: 8px;
      background: #007BFF;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #0056b3;
    }

    p {
      margin-top: 1rem;
      font-size: 0.9rem;
    }

    a {
      color: #007BFF;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* Status message box */
    #statusMessage {
      margin-top: 1rem;
      font-weight: bold;
      padding: 0.5rem;
      border-radius: 6px;
      min-height: 1.5em;
    }
    .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
  </style>
</head>
<body>

  <div class="form-container">
    <h1>Send Enquiry</h1>
    <form id="enquiryForm">
      <input type="text" name="name" placeholder="Full Name" required>
      <input type="tel" name="phone" placeholder="Phone Number" pattern="[0-9]{10}" maxlength="10" required>
      <input type="email" name="email" placeholder="Email" required>
      
      <!-- Custom Configuration Section -->
      <div style="text-align: left; margin: 15px 0 10px 0; border: 1px dashed #cbd5e1; padding: 12px; border-radius: 8px; background: #f8fafc;">
        <label style="font-size: 0.85rem; font-weight: bold; color: #475569; display: block; margin-bottom: 8px;">💻 Customize Hardware Specifications:</label>
        
        <div style="display: flex; gap: 8px; margin-bottom: 8px;">
          <select name="processor" style="flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #ccc; font-size: 0.9rem;">
            <option value="">Select Processor</option>
            <option value="Intel Core i5">Intel Core i5</option>
            <option value="Intel Core i7">Intel Core i7</option>
            <option value="Intel Core i9">Intel Core i9</option>
            <option value="Intel Xeon">Intel Xeon</option>
            <option value="AMD Ryzen 5/7">AMD Ryzen 5/7</option>
            <option value="Apple Silicon M1/M2/M3">Apple Silicon</option>
          </select>
          
          <select name="ram" style="flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #ccc; font-size: 0.9rem;">
            <option value="">Select RAM</option>
            <option value="8 GB">8 GB RAM</option>
            <option value="16 GB">16 GB RAM</option>
            <option value="32 GB">32 GB RAM</option>
            <option value="64 GB">64 GB RAM</option>
            <option value="128 GB+">128 GB+</option>
          </select>
        </div>
        
        <div style="display: flex; gap: 8px;">
          <select name="storage" style="flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #ccc; font-size: 0.9rem;">
            <option value="">Select Storage</option>
            <option value="256 GB SSD">256 GB SSD</option>
            <option value="512 GB SSD">512 GB SSD</option>
            <option value="1 TB SSD">1 TB SSD</option>
            <option value="2 TB+ SSD">2 TB+ SSD</option>
            <option value="Custom HDD">Custom HDD</option>
          </select>
          
          <select name="gpu" style="flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #ccc; font-size: 0.9rem;">
            <option value="">Select GPU</option>
            <option value="Integrated Graphics">Integrated GPU</option>
            <option value="NVIDIA RTX Dedicated">NVIDIA RTX Dedicated</option>
            <option value="AMD Radeon">AMD Radeon</option>
          </select>
        </div>
      </div>

      <textarea name="message" placeholder="Your Message / Additional requirements" required></textarea>
      <button type="submit">Submit</button>
    </form>
    <p id="statusMessage"></p>
    <p><a href="index.html">Back to Home</a></p>
  </div>

  <script>
const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? 'http://localhost:5000' : '';
    const token = localStorage.getItem("accessToken");
    if (!token) {
      alert("Please log in first to send enquiries.");
      window.location.href = "login.html";
    }

    const form = document.getElementById("enquiryForm");
    const statusMessage = document.getElementById("statusMessage");

    // Pre-fill message from query param if available
    const urlParams = new URLSearchParams(window.location.search);
    const messageParam = urlParams.get('message');
    if (messageParam) {
      form.message.value = messageParam;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const token = localStorage.getItem("accessToken");
      if (!token) {
        statusMessage.textContent = "❌ You must be logged in to send enquiries. Please login or signup first.";
        statusMessage.className = "error";
        return;
      }

      statusMessage.textContent = "⏳ Sending your enquiry...";
      statusMessage.className = "info";

      let specsText = "";
      if (form.processor.value || form.ram.value || form.storage.value || form.gpu.value) {
        specsText = `[Custom Configuration Requested:\n` +
                    `- Processor: ${form.processor.value || 'Not specified'}\n` +
                    `- RAM: ${form.ram.value || 'Not specified'}\n` +
                    `- Storage: ${form.storage.value || 'Not specified'}\n` +
                    `- GPU: ${form.gpu.value || 'Not specified'}]\n\n`;
      }

      const formData = {
        name: form.name.value.trim(),
        phone: form.phone.value.trim(),
        email: form.email.value.trim(),
        message: specsText + form.message.value.trim()
      };

      try {
        const res = await fetch(`${API_BASE}/api/contact`, {
          method: "POST",
          headers: { 
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
          },
          body: JSON.stringify(formData)
        });

        const json = await res.json();

        if (res.ok) {
          statusMessage.textContent = "✅ Your enquiry was sent successfully!";
          statusMessage.className = "success";
          form.reset();
        } else {
          statusMessage.textContent = "❌ " + (json.error || "Failed to send enquiry.");
          statusMessage.className = "error";
        }
      } catch (err) {
        console.error(err);
        statusMessage.textContent = "❌ Server error. Please try again later.";
        statusMessage.className = "error";
      }
    });
  </script>

</body>
</html>
