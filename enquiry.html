<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Send Enquiry - Gigahub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f0f4f8;
    }

    .form-container {
      background: #fff;
      padding: 2rem 3rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 400px;
      text-align: center;
    }

    h1 {
      margin-bottom: 1.5rem;
      color: #007BFF;
    }

    input, textarea {
      width: 100%;
      padding: 0.8rem 1rem;
      margin: 0.5rem 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    button {
      width: 100%;
      padding: 0.8rem 1rem;
      margin-top: 1rem;
      border: none;
      border-radius: 8px;
      background: #007BFF;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #0056b3;
    }

    p {
      margin-top: 1rem;
      font-size: 0.9rem;
    }

    a {
      color: #007BFF;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* Status message box */
    #statusMessage {
      margin-top: 1rem;
      font-weight: bold;
      padding: 0.5rem;
      border-radius: 6px;
      min-height: 1.5em;
    }
    .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
  </style>
</head>
<body>

  <div class="form-container">
    <h1>Send Enquiry</h1>
    <form id="enquiryForm">
      <input type="text" name="name" placeholder="Full Name" required>
      <input type="tel" name="phone" placeholder="Phone Number" pattern="[0-9]{10}" maxlength="10" required>
      <input type="email" name="email" placeholder="Email" required>
      <textarea name="message" placeholder="Your Message" required></textarea>
      <button type="submit">Submit</button>
    </form>
    <p id="statusMessage"></p>
    <p><a href="index.html">Back to Home</a></p>
  </div>

  <script>
    const token = localStorage.getItem("accessToken");
    if (!token) {
      alert("Please log in first to send enquiries.");
      window.location.href = "login.html";
    }

    const form = document.getElementById("enquiryForm");
    const statusMessage = document.getElementById("statusMessage");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const token = localStorage.getItem("accessToken");
      if (!token) {
        statusMessage.textContent = "❌ You must be logged in to send enquiries. Please login or signup first.";
        statusMessage.className = "error";
        return;
      }

      statusMessage.textContent = "⏳ Sending your enquiry...";
      statusMessage.className = "info";

      const formData = {
        name: form.name.value.trim(),
        phone: form.phone.value.trim(),
        email: form.email.value.trim(),
        message: form.message.value.trim()
      };

      try {
        const res = await fetch("http://localhost:5000/api/contact", {
          method: "POST",
          headers: { 
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
          },
          body: JSON.stringify(formData)
        });

        const json = await res.json();

        if (res.ok) {
          statusMessage.textContent = "✅ Your enquiry was sent successfully!";
          statusMessage.className = "success";
          form.reset();
        } else {
          statusMessage.textContent = "❌ " + (json.error || "Failed to send enquiry.");
          statusMessage.className = "error";
        }
      } catch (err) {
        console.error(err);
        statusMessage.textContent = "❌ Server error. Please try again later.";
        statusMessage.className = "error";
      }
    });
  </script>

</body>
</html>
