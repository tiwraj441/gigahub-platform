<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Register - Gigahub</title>

<!-- Bootstrap CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.5.3/css/bootstrap.min.css">
<!-- Font Awesome for icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
<!-- Your custom CSS -->
<link rel="stylesheet" href="./css/style.css">

<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #f2f2f2;
  }
  .register-card {
    padding: 40px;
    border-radius: 10px;
    background: #fff;
    box-shadow: 0px 0px 20px rgba(0,0,0,0.1);
    width: 400px;
    max-width: 90%;
  }
  .register-card h3 {
    text-align: center;
    margin-bottom: 30px;
    color: #007bff;
  }
  .btn-primary {
    background-color: #007bff;
    border: none;
  }
  .btn-primary:hover {
    background-color: #0056b3;
  }
  .login-link {
    display: block;
    text-align: center;
    margin-top: 15px;
  }
</style>
</head>
<body>

<div class="register-card">
  <h3><i class="fas fa-user-plus"></i> Admin Register</h3>
  <form id="adminRegisterForm">
    <div class="form-group">
      <input type="text" class="form-control" id="name" placeholder="Full Name" required>
    </div>
    <div class="form-group">
      <input type="email" class="form-control" id="email" placeholder="Email" required>
    </div>
    <div class="form-group">
      <input type="password" class="form-control" id="password" placeholder="Password" required>
    </div>
    <div class="form-group">
      <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm Password" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Register</button>
  </form>

  <!-- Optional: Link to Admin Login -->
  <a href="admin-login.html" class="btn btn-outline-primary btn-block login-link">
    Already have an account? Login
  </a>
</div>

<!-- Bootstrap JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? 'http://localhost:5000' : '';
document.getElementById('adminRegisterForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if(password !== confirmPassword){
        alert("Passwords do not match");
        return;
    }

    try {
        const res = await fetch(`${API_BASE}/api/admin/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();
        if(data.success){
            alert('Admin registered successfully! Login now.');
            window.location.href = 'admin-login.html';
        } else {
            alert(data.error || data.message || 'Registration failed');
        }
    } catch(err){
        console.error(err);
        alert('Server error');
    }
});
</script>
</body>
</html>
